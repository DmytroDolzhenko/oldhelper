services:
  - type: web
    name: rust-telegram-bridge
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: STORAGE_DRIVER
        value: supabase
      - key: TELEGRAM_MODE
        value: webhook
      - key: ALERT_COOLDOWN_SECONDS
        value: 60
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
