<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rust Telegram Bridge</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <h1>Rust Telegram Bridge</h1>
          <p>Rust+ smart alarm та інші події у Telegram для всієї групи.</p>
        </div>
      </section>

      <section class="grid">
        <article class="panel">
          <div class="panel-title">
            <h2>Підключення Rust+</h2>
            <span id="connectionState">offline</span>
          </div>
          <form id="serverForm">
            <input type="hidden" id="serverId" />
            <label>Назва сервера<input id="name" required placeholder="My wipe server" /></label>
            <label>IP або hostname<input id="ip" required placeholder="203.0.113.10" /></label>
            <label>Companion port<input id="port" required type="number" min="10000" value="28082" /></label>
            <label>SteamID64 / playerId<input id="playerId" required /></label>
            <label>playerToken<input id="playerToken" required /></label>
            <label class="switch"><input id="enabled" type="checkbox" checked /> Увімкнути listener</label>
            <h3>Пристрої</h3>
            <div id="entities"></div>
            <button type="button" id="addEntity">Додати device</button>
            <button type="submit">Зберегти сервер</button>
          </form>
        </article>

        <article class="panel">
          <div class="panel-title">
            <h2>Telegram</h2>
            <button id="setWebhook">Set webhook</button>
          </div>
          <p class="muted">Користувачі пишуть боту /start. Steam потрібен тільки власнику bridge.</p>
          <p id="telegramStatus" class="notice"></p>
          <div id="subscribers" class="list"></div>
        </article>

        <article class="panel wide">
          <div class="panel-title">
            <h2>Останні події</h2>
            <button id="refresh">Оновити</button>
          </div>
          <div id="events" class="list"></div>
        </article>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
