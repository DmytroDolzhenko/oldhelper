<!doctype html>
<html lang="uk">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rust Telegram Bridge</title><link rel="stylesheet" href="/styles.css"></head>
  <body>
    <main class="shell">
      <header class="topbar"><div><h1>Rust Telegram Bridge</h1><p id="user">Завантаження…</p></div><a class="steam-login" href="/api/auth/steam">Увійти через Steam</a></header>
      <section class="grid">
        <article class="panel"><h2>1. Telegram</h2><p id="telegram">Telegram ще не підключено</p><button id="connectTelegram">Прив’язати Telegram</button></article>
        <article class="panel"><h2>2. Підключення Rust+</h2><p>У грі відкрийте Rust+, натисніть Pair with Server. Після появи сервера повторіть дію для потрібного девайсу.</p><p id="status" class="notice active"></p><button id="refresh" class="secondary">Оновити</button></article>
        <section class="wide"><h2>Мої сервери й девайси</h2><div id="servers" class="list"></div></section>
      </section>
    </main><script src="/app.js"></script>
  </body>
</html>
